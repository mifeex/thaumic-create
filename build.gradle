plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
def localAddonDependencies = file('.gradle/local-libs/neoforge-1.21.1').exists() ? '.gradle/local-libs/neoforge-1.21.1' : 'libs'

version = '0.4.0'
group = 'com.thaumiccreate'
base { archivesName = 'thaumic-create-neoforge-1.21.1' }
java { toolchain.languageVersion = JavaLanguageVersion.of(21) }
neoForge {
    enable { version = '21.1.259'; disableRecompilation = true }
    mods { thaumic_create { sourceSet sourceSets.main } }
}



// Opt-in real-server verification; validation classes never enter release JARs.
if (providers.gradleProperty('verifyPress').isPresent()) {
    sourceSets.main.java.srcDir 'src/validation/java'
    sourceSets.main.resources.srcDir 'src/validation/resources'
    dependencies { implementation fileTree(dir: 'build/validation-mods', include: '*.jar'); compileOnly fileTree(dir: 'build/validation-compile', include: '*.jar') }
    neoForge.runs {
        pressGameTest {
            type = 'gameTestServer'
            gameDirectory = file('build/validation-run')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'thaumic_create_tests'
        }
    }
}
jar { exclude 'com/thaumiccreate/validation/**', 'data/thaumic_create_tests/**' }

dependencies { compileOnly fileTree(dir: localAddonDependencies, include: '*.jar') }

// Include the actual mods when launching a development client.
def localAddonRuntime = file('.gradle/local-runtime/neoforge-1.21.1').exists() ? '.gradle/local-runtime/neoforge-1.21.1' : 'runtime-mods'
dependencies {
    runtimeOnly fileTree(dir: localAddonDependencies, include: '*.jar')
    runtimeOnly fileTree(dir: localAddonRuntime, include: '*.jar')
}
neoForge.runs {
    client {
        client()
        gameDirectory = file('run-neoforge')
    }
}
