plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '6.0.54'
}
def localAddonDependencies = file('.gradle/local-libs/forge-1.20.1').exists() ? '.gradle/local-libs/forge-1.20.1' : 'libs'

version = '0.4.0'
group = 'com.thaumiccreate'
base { archivesName = 'thaumic-create-forge-1.20.1' }
java { toolchain.languageVersion = JavaLanguageVersion.of(17) }
minecraft { mappings channel: 'official', version: '1.20.1' }
repositories { mavenCentral() }
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.4.10' }
jar.finalizedBy('reobfJar')

jar { manifest { attributes('MixinConfigs': 'thaumic_create.mixins.json') } }



dependencies { compileOnly fileTree(dir: localAddonDependencies, include: '*.jar') }

if (providers.gradleProperty('verifyDevices').isPresent()) {
    sourceSets.main.java.srcDir 'src/validation/java'
    sourceSets.main.resources.srcDir 'src/validation/resources'
    dependencies {
        implementation fileTree(dir:'build/validation-mods', include:'*.jar')
        runtimeOnly fileTree(dir:localAddonDependencies, include:'*.jar')
    }
    minecraft.runs {
        gameTestServer {
            workingDirectory file('build/validation-run')
            property 'forge.enabledGameTestNamespaces', 'thaumic_create_tests'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', file('build/createSrgToMcp/output.srg').absolutePath
            args '-mixin.config=thaumic_create.mixins.json'
            mods { thaumic_create { source sourceSets.main } }
        }
    }
}
jar { exclude 'com/thaumiccreate/validation/**', 'data/thaumic_create_tests/**' }

// Runtime mods are separate from compile-only API libraries.
def localAddonRuntime = file('.gradle/local-runtime/forge-1.20.1').exists() ? '.gradle/local-runtime/forge-1.20.1' : 'runtime-mods'
dependencies {
    runtimeOnly fileTree(dir: localAddonDependencies, include: '*.jar')
    runtimeOnly fileTree(dir: localAddonRuntime, include: '*.jar')
}
minecraft.runs {
    client {
        workingDirectory file('run')
        property 'mixin.env.remapRefMap', 'true'
        property 'mixin.env.refMapRemappingFile', file('build/createSrgToMcp/output.srg').absolutePath
        args '-mixin.config=thaumic_create.mixins.json'
        mods { thaumic_create { source sourceSets.main } }
    }
}
